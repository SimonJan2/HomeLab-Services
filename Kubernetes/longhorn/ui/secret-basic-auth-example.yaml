---
# Basic-auth Secret for the Longhorn UI.
#
# !!! REPLACE THE PLACEHOLDER BELOW before applying !!!
#
# The `auth` key must contain the OUTPUT of `htpasswd` (apr1/bcrypt), base64-encoded
# WITHOUT a trailing newline when you paste it into `data.auth`. The easiest way is
# to let kubectl build the Secret for you (recommended) — see the guide — but this
# file is provided so the manifest set is complete and GitOps-friendly.
#
# --- Generate the credentials -----------------------------------------------
#   sudo apt-get install -y apache2-utils   # if htpasswd is missing
#   htpasswd -nb simonj 'YOUR_PASSWORD_HERE'
#   # example output:  simonj:$apr1$abcdEFGH$1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d
#
# --- Option A (recommended): create the Secret directly with kubectl --------
#   kubectl -n longhorn-system create secret generic basic-auth \
#     --from-file=auth=<(htpasswd -nb simonj 'YOUR_PASSWORD_HERE')
#
# --- Option B: base64-encode the htpasswd line and put it in this file ------
#   echo -n 'simonj:$apr1$abcdEFGH$1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d' | base64
#   # paste the output below as the value of `auth:`
#
# Then:
#   kubectl apply -f ui/secret-basic-auth.yaml
apiVersion: v1
kind: Secret
metadata:
  name: basic-auth
  namespace: longhorn-system
type: Opaque
data:
  # PLACEHOLDER — base64 of "simonj:REPLACE_ME" — NOT a valid login. Replace before applying!
  # To set your real password, use Option A (kubectl, recommended) OR base64-encode your
  # htpasswd line:  echo -n 'YOUR_HTPASSWD_LINE' | base64   and paste the output here.
  auth: ReplaceWithYourBase64EncodedCredentials
