---
# TLS secret for the Longhorn UI IngressRoute.
# This is a COPY of the wildcard *.local.simonlab.xyz cert originally issued by
# cert-manager (letsencrypt-production) into the default namespace.
#
# We copy it here instead of issuing a fresh Certificate because Let's Encrypt
# rate-limits to 5 certs per exact set of identifiers per 168 hours (7 days),
# and the Traefik/cert-manager setup already used that quota.
#
# To re-create this secret from the existing one in the default namespace:
#   kubectl get secret local-simonlab-xyz-tls -n default -o yaml \
#     | sed 's/namespace: default/namespace: longhorn-system/' \
#     | kubectl apply -f -
#
# When the original cert renews (cert-manager does this automatically ~30 days
# before expiry), re-run the copy command above to refresh this secret.
#
# How to get the certificate and private key with command
#   kubectl get secret local-simonlab-xyz-tls -n default -o yaml
#
# Apply with:
#   kubectl apply -f secret-tls.yaml
apiVersion: v1
data:
  tls.crt: ReplaceWithYourBase64EncodedCertificate
  tls.key: ReplaceWithYourBase64EncodedPrivateKey
kind: Secret
metadata:
  name: local-simonlab-xyz-tls
  namespace: longhorn-system
type: kubernetes.io/tls

