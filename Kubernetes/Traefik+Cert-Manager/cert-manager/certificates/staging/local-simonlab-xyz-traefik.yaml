---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-simonlab-xyz
  namespace: traefik
spec:
  secretName: local-simonlab-xyz-staging-tls
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  commonName: "*.local.simonlab.xyz"
  dnsNames:
  - "local.simonlab.xyz"
  - "*.local.simonlab.xyz"